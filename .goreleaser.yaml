# goreleaser release --clean   (CI runs it on every v* tag, see .github/workflows/release.yml)
version: 2

project_name: zc-workstation

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/zc-workstation
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# An SPDX SBOM per archive, made by syft.
sboms:
  - artifacts: archive

# Keyless cosign: the signature binds checksums.txt to this repository's
# release workflow through GitHub's OIDC token, with no key to keep.
# Verify steps: docs/modules/ROOT/pages/security.adoc
# cosign 3 writes the signature and certificate into one sigstore bundle.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum
    output: true

# deb, rpm and apk for Linux; `sudo dpkg -i`, `sudo rpm -i` or `sudo apk add --allow-untrusted`
nfpms:
  - package_name: zc-workstation
    vendor: ZoolCoder
    homepage: https://zoolcoder.github.io/zc-workstation/
    maintainer: ZoolCoder <abdallah.coder@gmail.com>
    description: "Declarative reconcile tool: plan and apply what a YAML file declares; CLI, admin page, MCP server and agent skills"
    license: MIT
    section: utils
    bindir: /usr/bin
    formats: [deb, rpm, apk]
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/zc-workstation/LICENSE

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude: ['^docs', '^chore', '^ci', '^test']

release:
  draft: false
  prerelease: auto

# The cask lives in this repo: brew tap zoolcoder/zc-workstation https://github.com/zoolcoder/zc-workstation
# brew tap clones the default branch, develop. develop takes changes only
# through pull requests, so the cask arrives as one.
homebrew_casks:
  - name: zc-workstation
    repository:
      owner: zoolcoder
      name: zc-workstation
      branch: "chore/cask-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: zoolcoder
          name: zc-workstation
          branch: develop
    directory: Casks
    commit_author:
      name: goreleaser
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "chore(brew): cask for {{ .Tag }}"
    homepage: https://zoolcoder.github.io/zc-workstation/
    description: "Declarative reconcile tool: plan and apply what a YAML file declares; CLI, admin page, MCP server and agent skills"
    license: MIT
