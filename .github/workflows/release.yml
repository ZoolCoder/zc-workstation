name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # upload the release assets and push the cask branch
  pull-requests: write   # open the cask pull request into develop
  id-token: write        # keyless cosign signature and the provenance attestation
  attestations: write    # store the provenance with GitHub

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # SLSA build provenance for every archive and package, checked with
      # gh attestation verify <file> --repo zoolcoder/zc-workstation
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  zcbar:
    # ZCBar, the menu bar app: a universal .app on the release, and a cask
    # for it in a pull request into develop, as goreleaser does for the CLI.
    needs: goreleaser
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Build
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          UNIVERSAL=1 VERSION=$version apps/menubar/package.sh dist/ZCBar.app
          ditto -c -k --keepParent dist/ZCBar.app "dist/ZCBar_${version}.zip"
          apps/menubar/cask.sh "$version" "$(shasum -a 256 "dist/ZCBar_${version}.zip" | cut -d' ' -f1)" > "$RUNNER_TEMP/zcbar.rb"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ZCBar_*.zip
      - name: Upload and open the cask pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "dist/ZCBar_${VERSION}.zip"
          branch="chore/zcbar-cask-${VERSION}"
          git switch -c "$branch" origin/develop
          mkdir -p Casks
          cp "$RUNNER_TEMP/zcbar.rb" Casks/zcbar.rb
          git config user.name goreleaser
          git config user.email goreleaser@users.noreply.github.com
          git add Casks/zcbar.rb
          git commit -m "chore(brew): zcbar cask for ${GITHUB_REF_NAME}"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "chore(brew): zcbar cask for ${GITHUB_REF_NAME}" \
            --body "The ZCBar cask for ${GITHUB_REF_NAME}, from the release workflow."
